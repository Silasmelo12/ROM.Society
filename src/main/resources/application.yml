server:
  port: 8080

spring:
  cloud:
    gcp:
      sql:
        enabled: false
      storage:
        enabled: true
        bucket: rom_society

  threads:
    virtual:
      enabled: true

  application:
    name: Club-Rom-Concept

  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:


  flyway:
    enabled: false

api:
  security:
    token:
      secret: ${JWT_SECRET}

resend:
  api:
    key: ${RESEND_API_KEY}

totem:
  api:
    key: ${TOTEM_API_KEY}